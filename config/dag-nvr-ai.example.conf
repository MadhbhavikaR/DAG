# DAG Nano NVR AI application settings.
# Copy to config/dag-nvr-ai.local.conf and adjust as required.
# Do not add NVR usernames, passwords, bot tokens or other secrets here.

NVR_HOST=192.168.100.103
NVR_HTTP_PORT=80
# Verify the actual RTSP port on the NVR before stream integration.
NVR_RTSP_PORT=554
NVR_CHANNELS=13

# Resource-bounded defaults for Jetson Nano 4GB.
EVENT_QUEUE_CAPACITY=128
MAX_CONCURRENT_INFERENCE=1

LOG_LEVEL=info
DATA_DIR=runtime

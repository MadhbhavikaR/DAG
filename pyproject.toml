[project]
name = "annas-archieve-callibre-plugin"
version = "0.1.0"
description = "Anna's Archive store plugin for Calibre"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "bandit>=1.7",
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", ".venv", "dist", "build"]
builtins = ["_", "load_translations"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "dist", "build"]

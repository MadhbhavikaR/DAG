[project]
name = "jetson-nano-fan-control"
version = "0.1.0"
description = "Temperature-based PWM fan control for NVIDIA Jetson Nano 4 GB devices"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "DAG contributors" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[project.scripts]
jetson-fan-control = "jetson_fan_control.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetson_fan_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project]
name = "dag-edit"
version = "0.1.0"
description = "Context-anchored JSON-first single-file editor."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
[project.scripts]
dag-edit = "dag_edit.cli:main"
[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0", "ruff>=0.8.0"]
[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/dag_edit"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
[tool.coverage.run]
branch = true
source = ["dag_edit"]
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E701", "E702", "E731"]

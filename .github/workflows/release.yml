name: Release

on:
  push:
    tags:
      - "Manager_*"
      - "DAG-Manager_*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example Manager_0.20.2)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Python distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release tag and version
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          elif [[ "${REF_TYPE}" == "tag" ]]; then
            tag="${REF_NAME}"
          else
            echo "::error::Provide an existing tag for manual runs."
            exit 1
          fi
          case "$tag" in
            Manager_*) version="${tag#Manager_}" ;;
            DAG-Manager_*) version="${tag#DAG-Manager_}" ;;
            *) echo "::error::Unsupported release tag: $tag"; exit 1 ;;
          esac
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version in tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Validate package metadata and source version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          expected = os.environ["EXPECTED_VERSION"]
          actual = pyproject["project"]["version"]
          if actual != expected:
              raise SystemExit(f"Tag version {expected!r} != pyproject version {actual!r}")
          if pyproject["build-system"]["build-backend"] != "setuptools.build_meta":
              raise SystemExit("Expected setuptools.build_meta as the PEP 517 backend")
          package = Path("src/manager")
          if not package.is_dir() or not (package / "__init__.py").is_file():
              raise SystemExit("Missing src/manager Python package")
          PY

      - name: Build wheel and source distribution
        run: uv build --no-sources --wheel --sdist

      - name: Validate built distributions
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          version = os.environ["EXPECTED_VERSION"]
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected one wheel and one sdist; found {len(wheels)} and {len(sdists)}"
              )
          wheel = wheels[0]
          sdist = sdists[0]
          if f"-{version.replace('-', '_')}-" not in wheel.name:
              raise SystemExit(f"Wheel filename does not match version: {wheel.name}")
          if not sdist.name.endswith(f"-{version}.tar.gz"):
              raise SystemExit(f"Source archive filename does not match version: {sdist.name}")
          with zipfile.ZipFile(wheel) as archive:
              metadata_files = [
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_files) != 1:
                  raise SystemExit("Wheel must contain exactly one METADATA file")
              metadata = archive.read(metadata_files[0]).decode("utf-8")
              if f"Version: {version}" not in metadata:
                  raise SystemExit("Wheel METADATA version does not match release tag")
              if not any(name.startswith("manager/") and name.endswith(".py")
                         for name in archive.namelist()):
                  raise SystemExit("Wheel does not contain the manager Python package")
          PY
          ls -lh dist/

      - name: Create release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$RELEASE_VERSION" =~ (rc|a|b|dev)[0-9]*$ ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes --prerelease
            else
              gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
            fi
          fi

      - name: Upload wheel and source distribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --clobber

name: Release

on:
  push:
    tags:
      - "*_*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Validate tag and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Validate branch-prefixed semantic version tag
        id: validate
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^([A-Za-z0-9][A-Za-z0-9._-]*)_([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag must be <branch-name>_<semantic-version>, for example DAG-Linux-Telegram-Notifications_0.1.0" >&2
            exit 1
          fi
          echo "branch_name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          BRANCH_NAME: ${{ steps.validate.outputs.branch_name }}
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            --title "$BRANCH_NAME $VERSION" \
            --generate-notes

name: Create tagged release

on:
  push:
    tags:
      - 'Kindle-Fetch_[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Package KindleFetch and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Validate branch-prefixed semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^Kindle-Fetch_([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must match Kindle-Fetch_<major>.<minor>.<patch> (for example Kindle-Fetch_1.0.0)." >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
      - name: Validate extension files
        shell: bash
        run: |
          set -euo pipefail
          test -f kindlefetch/config.xml
          test -f kindlefetch/menu.json
          test -f kindlefetch/run.sh
          test -d kindlefetch/bin
      - name: Build extension archive
        shell: bash
        run: |
          set -euo pipefail
          test -f kindlefetch/config.xml
          test -f kindlefetch/menu.json
          test -f kindlefetch/run.sh
          test -d kindlefetch/bin
          zip -r "Kindle-Fetch_${{ steps.version.outputs.version }}.zip" kindlefetch
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Kindle-Fetch_${{ steps.version.outputs.version }}.zip" \
            --title "Kindle-Fetch ${{ steps.version.outputs.version }}" \
            --generate-notes

name: CI

on:
  push:
    branches: ["main", "DAG-Template-Python", "DAG-Manager"]
  pull_request:
    branches: ["main", "DAG-Template-Python", "DAG-Manager"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Resolve lockfile and install project
        run: |
          uv lock --system-certs
          uv sync --system-certs --all-groups

      - name: Check formatting
        run: uv run --system-certs ruff format --check .

      - name: Lint
        run: uv run --system-certs ruff check src tests

      - name: Type check
        run: uv run --system-certs mypy

      - name: Test with coverage
        run: uv run --system-certs pytest --cov --cov-report=term-missing

name: CI

on:
  push:
    branches: ["DAG-Nano-4gb-NVR-AI"]
  pull_request:
    branches: ["DAG-Nano-4gb-NVR-AI"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, tests and native build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show pinned Rust toolchain
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build optimized application
        run: cargo build --locked --release

  arm64:
    name: ARM64 Linux cross-build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ARM64 linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Install Rust ARM64 target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Build for Jetson ARM64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target aarch64-unknown-linux-gnu

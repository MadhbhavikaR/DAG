name: CI

on:
  push:
    branches: ["main", "DAG-Template-Python", "DAG-Manager", "Manager"]
  pull_request:
    branches: ["main", "DAG-Template-Python", "DAG-Manager", "Manager"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Resolve lockfile and install project
        run: |
          uv lock --check --system-certs
          uv sync --locked --system-certs --all-groups
      - name: Check formatting
        run: uv run --system-certs ruff format --check .
      - name: Lint
        run: uv run --system-certs ruff check src tests
      - name: Type check
        run: uv run --system-certs mypy src/manager/domain.py src/manager/errors.py src/manager/git_repository.py src/manager/parser.py src/manager/step.py src/manager/submission.py src/manager/task.py
      - name: Test with coverage
        run: uv run --system-certs pytest --cov --cov-report=term-missing

version = 1
revision = 3
requires-python = ">=3.10"

[[package]]
name = "dag-linux-telegram-notifications"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "fail2ban" },
    { name = "requests" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "fail2ban", specifier = ">=1.0.2" },
    { name = "requests", specifier = ">=2.32.0,<3.0.0" },
]
requires-dev = [
    { name = "pytest", group = "dev", specifier = ">=8.3.0" },
    { name = "ruff", group = "dev", specifier = ">=0.11.0" },
]
